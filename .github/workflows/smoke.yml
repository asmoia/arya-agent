name: Local model smoke

on:
  push:
    branches: [redesign/v1]
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (assert first token) or lab (tmate+puppet)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - lab
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.mode || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  smoke:
    name: install → push 0.6B → first token < 90s
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache Gradle + CMake/llama
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
            app/build/_deps
            app/build/intermediates/cxx
          key: lab-ndk-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '**/*.gradle*') }}
          restore-keys: lab-ndk-

      - name: Cache Qwen3-0.6B GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/arya-models
          key: qwen3-06b-q4km-484220320

      - name: Download GGUF if missing
        run: |
          mkdir -p ~/.cache/arya-models
          DEST=~/.cache/arya-models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          if [ ! -f "$DEST" ] || [ "$(stat -c%s "$DEST")" -lt 400000000 ]; then
            curl -L --retry 5 -o "$DEST" \
              "https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
          fi
          test "$(stat -c%s "$DEST")" -gt 400000000

      - name: Grant execute
        run: chmod +x gradlew scripts/*.sh

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Emulator smoke (first token)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODEL_CACHE: /home/runner/.cache/arya-models
          LAB_OUT: ${{ github.workspace }}/lab-out
        with:
          api-level: 31
          target: default
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash scripts/emulator-local-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-smoke
          path: |
            lab-out/**
            logcat*.txt
            smoke.png
          if-no-files-found: warn
          retention-days: 7

  lab:
    name: Live emulator lab
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'lab' || github.event.inputs.mode == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LAB_MODE: both
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/v1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache Gradle + CMake/llama
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
            app/build/_deps
            app/build/intermediates/cxx
          key: lab-ndk-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '**/*.gradle*') }}
          restore-keys: lab-ndk-

      - name: Cache Qwen3-0.6B GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/arya-models
          key: qwen3-06b-q4km-484220320

      - name: Download GGUF if missing
        run: |
          mkdir -p ~/.cache/arya-models
          DEST=~/.cache/arya-models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          if [ ! -f "$DEST" ] || [ "$(stat -c%s "$DEST")" -lt 400000000 ]; then
            curl -L --retry 5 -o "$DEST" \
              "https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
          fi
          test "$(stat -c%s "$DEST")" -gt 400000000

      - name: Grant execute
        run: chmod +x gradlew scripts/*.sh

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Hold timer
        run: echo "LAB_HOLD_SECS=14400" >> "$GITHUB_ENV"

      - name: Boot emulator + tmate/puppet
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAB_MODE: both
        with:
          api-level: 31
          target: default
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: export MODEL_CACHE="$HOME/.cache/arya-models" LAB_OUT="$GITHUB_WORKSPACE/lab-out" && bash scripts/live-lab-boot.sh && bash scripts/live-lab-hold.sh

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-lab
          path: |
            lab-out/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 5
