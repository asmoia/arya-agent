name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (leave empty to use the triggering ref)'
        required: false
        default: ''
      force_debug_release:
        description: 'If signing secrets missing, publish debug APK as prerelease'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Detect signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present — will build signed release APK"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing. Will build debug APK. See RELEASING.md."
          fi

      - name: Prepare release signing
        if: steps.signing.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/arya-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          # No leading spaces — Properties keys must be exact.
          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } > local.properties
          echo "Wrote local.properties (keystore path only, no secret echo)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile app sources
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.mode == 'release'
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback)
        if: steps.signing.outputs.mode == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect artifacts
        id: arts
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title_suffix= (signed)" >> "$GITHUB_OUTPUT"
          else
            find app/build/outputs/apk/debug -name '*.apk' -exec cp {} dist/ \;
            for f in dist/*.apk; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .apk)
              mv "$f" "dist/${base}-UNSIGNED-DEBUG.apk"
            done
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title_suffix= (debug unsigned — not for production upgrade path)" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist/
          test -n "$(ls -A dist/*.apk 2>/dev/null)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Generate release notes
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          version = os.environ.get("VERSION", "manual").removeprefix("v")
          mode = os.environ.get("MODE", "debug")
          notes = [f"## Arya {version}\n"]
          if mode == "debug":
              notes.append("> ⚠️ **Debug / unsigned build** — for testing only.\n")
              notes.append("> For **upgrade without uninstall**, add release keystore secrets and re-tag.\n")
              notes.append("> See `RELEASING.md`.\n")
          else:
              notes.append("> ✅ Signed release — install/upgrade with the same package `io.agents.arya`.\n")
          for name in ("docs/REDESIGN_CHANGELOG.md", "MODELS.md", "ARCHITECTURE.md"):
              p = Path(name)
              if p.exists():
                  notes.append(f"\n### From {name}\n")
                  notes.append(p.read_text(encoding="utf-8")[:3500])
                  notes.append("\n")
          notes.append("\n### Model note\n")
          notes.append("Local models live under the app files directory (`…/files/models`) and **survive APK upgrades**.\n")
          notes.append("They are only wiped by **Clear Data** / uninstall.\n")
          notes.append("\nEngine: llama.cpp **b10603**, isolated `:engine` process, ABIs arm64-v8a + x86_64.\n")
          Path("release-notes.md").write_text("\n".join(notes), encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}${{ steps.arts.outputs.title_suffix }}
          files: |
            dist/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.arts.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
